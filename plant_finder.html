<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indiana Wild Edibles Finder</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!--Header-->
    <header>
      <div class="header-container">
    <a href="index.html">
        <img src="images/indiana_logo.png" alt="Indiana Wild Edibles Finder logo">
    </a>
    <h1 class="header-title">Indiana Wild Edibles Finder</h1>
</div>
    </header>
      </div>
    </header>
    <!--navigation bar-->
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="plant_finder.html">Plant Finder</a></li>
        <li><a href="edibles.html">Edibles</a></li>
        <li><a href="safety.html">Safety</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="contribute.html"></a></li>
      </ul>
    </nav>
  <main>
    <!-- New wrapper container to split your page into two columns -->
    <div class="sidebar-layout-container">
        
        <!-- COLUMN 1: The Left Sidebar Filter Box -->
        <div class="finder-box">
            <h2>Find Edible Plants</h2>
            
            <div class="filter-group">
                <label class="filter-label">Region</label>
                <select id="regionFilter" class="filter-select">
                    <option value="all">All Regions</option>
                    <option value="Northern">Northern Indiana</option>
                    <option value="Central">Central Indiana</option>
                    <option value="Southern">Southern Indiana</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">Season</label>
                <select id="seasonFilter" class="filter-select">
                    <option value="all">All Seasons</option>
                    <option value="Spring">Spring</option>
                    <option value="Summer">Summer</option>
                    <option value="Autumn">Autumn</option>
                    <option value="Winter">Winter</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">Habitat</label>
                <select id="habitatFilter" class="filter-select">
                    <option value="all">All Habitats</option>
                    <option value="Forest">Forest / Woods</option>
                    <option value="Wetland">Wetland / Riverbank</option>
                    <option value="Field">Field / Open Meadow</option>
                    <option value="Urban">Urban</option>
                </select>
            </div>

            <button id="search-btn">Find Plants</button>
        </div>

        <!-- COLUMN 2: The Main Area where plant cards display -->
        <section id="results"></section>

    </div>

    <script src="app.js"></script>
</main>
      </div>
    <!--FOOTER-->
    <footer>
      <div class="footer">
        <h3>loreum ipsum</h3>
      </div>
    </footer>
  </body>
</html>
